<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A0/OS</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <div id="grid-overlay" aria-hidden="true"></div>

  <div id="desktop">
    <div id="desktop-icons"></div>
  </div>

  <div id="windows-container"></div>

  <div id="taskbar">
    <div id="taskbar-left">
      <button id="launcher-btn" title="Applications Menu" tabindex="0">A0</button>
    </div>
    <div id="taskbar-center" role="tablist"></div>
    <div id="taskbar-right">
      <span id="taskbar-clock">--:--</span>
    </div>
  </div>

  <div id="launcher-menu" class="hidden" role="menu"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
